name: Bug report
description: voicerig did something wrong, or said something misleading
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: rig
    attributes:
      label: Your rig.yaml (remove secrets; `${VAR}` references are fine)
      render: yaml
    validations: {required: true}
  - type: textarea
    id: output
    attributes:
      label: Output of `voicerig run` and, if relevant, `voicerig logs agent`
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS/arch, Docker version, Python version, voicerig version, livekit-agents version"
    validations: {required: true}
